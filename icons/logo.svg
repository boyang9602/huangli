<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="500" fill="#af231c" />
    <g transform="translate(250, 250)">
        <polygon points="
            -100,-240 100,-240
            240,-100 240,100
            100,240 -100,240
            -240,100 -240,-100" 
            fill="none" stroke="#e5b746" stroke-width="5" />
        <circle cx="0" cy="0" r="120" fill="none" stroke="#e5b746" stroke-width="5" />
        <text x="0" y="50" font-family="serif" font-size="130" fill="#e5b746" text-anchor="middle" font-weight="bold">吉</text>
        <defs>
            <rect id="yang" x="-55" y="0" width="110" height="12" fill="#e5b746" />
            <g id="yin">
                <rect x="-55" y="0" width="50" height="12" fill="#e5b746" />
                <rect x="5" y="0" width="50" height="12" fill="#e5b746" />
            </g>
            <g id="trigram-top">
                <use href="#yang" y="-210" />
                <use href="#yang" y="-185" />
                <use href="#yang" y="-160" />
            </g>
            <g id="trigram-tr">
                <use href="#yang" y="-210" />
                <use href="#yang" y="-185" />
                <use href="#yin" y="-160" />
            </g>
            <g id="trigram-right">
                <use href="#yin" y="-210" />
                <use href="#yang" y="-185" />
                <use href="#yin" y="-160" />
            </g>
            <g id="trigram-br">
                <use href="#yang" y="-210" />
                <use href="#yin" y="-185" />
                <use href="#yin" y="-160" />
            </g>
            <g id="trigram-bottom">
                <use href="#yin" y="-210" />
                <use href="#yin" y="-185" />
                <use href="#yin" y="-160" />
            </g>
            <g id="trigram-bl">
                <use href="#yin" y="-210" />
                <use href="#yin" y="-185" />
                <use href="#yang" y="-160" />
            </g>
            <g id="trigram-left">
                <use href="#yang" y="-210" />
                <use href="#yin" y="-185" />
                <use href="#yang" y="-160" />
            </g>
            <g id="trigram-tl">
                <use href="#yin" y="-210" />
                <use href="#yang" y="-185" />
                <use href="#yang" y="-160" />
            </g>
        </defs>
        <use href="#trigram-top" />
        <use href="#trigram-tr" transform="rotate(45)" />
        <use href="#trigram-right" transform="rotate(90)" />
        <use href="#trigram-br" transform="rotate(135)" />
        <use href="#trigram-bottom" transform="rotate(180)" />
        <use href="#trigram-bl" transform="rotate(225)" />
        <use href="#trigram-left" transform="rotate(270)" />
        <use href="#trigram-tl" transform="rotate(315)" />
    </g>
</svg>
